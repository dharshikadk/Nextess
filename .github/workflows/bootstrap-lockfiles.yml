name: Bootstrap npm lockfiles

on:
  push:
    branches:
      - fix/vercel-backend-runtime-dotenv

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !hashFiles('backend/package-lock.json') || !hashFiles('database/package-lock.json') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate database lockfile
        working-directory: database
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json database/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add reproducible npm lockfiles"
          git push
