name: Nextess Production Content Import

on:
  workflow_dispatch:

jobs:
  import-content:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install database tooling
        working-directory: database
        run: npm install

      - name: Verify production database secret is injected
        working-directory: database
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL is empty or unavailable in the production environment."
            echo "::error::Configure the DATABASE_URL secret in GitHub Settings > Environments > production."
            exit 1
          fi

      - name: Validate mission content
        working-directory: database
        run: npm run mission:validate -- content

      - name: Import and publish production mission content
        working-directory: database
        run: npm run seed

      - name: Verify production migration state
        working-directory: database
        run: npx prisma migrate status
