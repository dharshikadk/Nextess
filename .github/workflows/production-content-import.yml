name: Nextess Production Content Import

on:
  workflow_dispatch:

jobs:
  import-content:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate production database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node database/scripts/assert-database-url.mjs

      - name: Install database tooling
        working-directory: database
        run: npm install

      - name: Validate mission content
        working-directory: database
        run: npm run mission:validate -- content

      - name: Import and publish production mission content
        working-directory: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run seed

      - name: Verify production migration state
        working-directory: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status
