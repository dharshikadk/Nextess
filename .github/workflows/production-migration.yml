name: Nextess Production Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare production database URL
        env:
          RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          let value = process.env.RAW_DATABASE_URL;
          if (typeof value !== 'string' || value.length === 0) {
            console.error('::error::DATABASE_URL is empty or unavailable in the production environment.');
            process.exit(1);
          }

          value = value.trim();

          if (
            value.length >= 2 &&
            ((value.startsWith('"') && value.endsWith('"')) ||
              (value.startsWith("'") && value.endsWith("'")))
          ) {
            value = value.slice(1, -1).trim();
          }

          if (value.startsWith('DATABASE_URL=')) {
            value = value.slice('DATABASE_URL='.length).trim();
          }

          if (!/^(postgresql|postgres):\/\//.test(value) || /[\r\n]/.test(value)) {
            console.error('::error::DATABASE_URL is not a valid single-line PostgreSQL URL.');
            console.error('::error::The secret must contain only the connection URL beginning with postgresql:// or postgres://.');
            process.exit(1);
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DATABASE_URL<<NEXTESS_DATABASE_URL\n${value}\nNEXTESS_DATABASE_URL\n`
          );

          console.log('DATABASE_URL format verified; value intentionally not displayed.');
          NODE

      - name: Validate normalized database URL
        working-directory: database
        run: npm run validate:database-url

      - name: Install database tooling
        working-directory: database
        run: npm install

      - name: Validate Prisma schema
        working-directory: database
        run: npm run validate

      - name: Apply reviewed migrations
        working-directory: database
        run: npm run migrate:deploy

      - name: Verify database readiness
        working-directory: database
        run: npx prisma migrate status
