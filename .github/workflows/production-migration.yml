name: Nextess Production Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install database tooling
        working-directory: database
        run: npm install
      - name: Verify production database secret is injected
        working-directory: database
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL is empty or unavailable in the production environment."
            echo "::error::Configure the DATABASE_URL secret in GitHub Settings > Environments > production."
            exit 1
          fi
          echo "DATABASE_URL is present in the runner environment (value intentionally not displayed)."
      - name: Validate Prisma schema
        working-directory: database
        run: npm run validate
      - name: Apply reviewed migrations
        working-directory: database
        run: npm run migrate:deploy
      - name: Verify database readiness
        working-directory: database
        run: npx prisma migrate status
