name: Nextess CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nextess
          POSTGRES_PASSWORD: nextess
          POSTGRES_DB: nextess_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextess -d nextess_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nextess:nextess@localhost:5432/nextess_ci
      FRONTEND_ORIGIN: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: npm --prefix ../database install
      - run: npm --prefix ../database run generate
      - run: npm --prefix ../database run seed
      - run: npm test
      - run: npm run build
      - name: Verify seeded runtime data
        env:
          DATABASE_URL: postgresql://nextess:nextess@localhost:5432/nextess_ci
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const p = new PrismaClient();
          try {
            const [subjects, projects, quotes] = await Promise.all([
              p.subject.count(),
              p.project.count({ where: { status: 'PUBLISHED' } }),
              p.dailyQuote.count(),
            ]);
            console.log({ subjects, projects, quotes });
            if (subjects < 2 || projects < 1 || quotes < 1) {
              throw new Error('Missing seeded runtime data');
            }
          } finally {
            await p.$disconnect();
          }
          NODE
      - name: Start API smoke server
        run: |
          nohup npm run dev >/tmp/nextess-api.log 2>&1 &
          echo $! >/tmp/nextess-api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nextess-api.log
          exit 1
      - name: Verify API catalogue and quote contracts
        run: |
          curl -fsS http://localhost:4000/v1/subjects | grep -q '"displayName":"Physics"'
          curl -fsS http://localhost:4000/v1/subjects | grep -q '"status":"FUTURE"'
          curl -fsS http://localhost:4000/v1/quotes/daily | grep -q '"author"'
          curl -fsS http://localhost:4000/v1/quotes/daily | grep -q '"date"'
      - name: Run database-backed mission runtime smoke test
        run: node scripts/runtime-smoke.mjs
      - name: Start frontend for browser E2E
        working-directory: ../frontend-v2
        env:
          VITE_API_BASE_URL: http://localhost:4000
        run: |
          npm install
          nohup npm run dev -- --host 127.0.0.1 >/tmp/nextess-frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nextess-frontend.log
          exit 1
      - name: Install Chromium for browser E2E
        working-directory: ../frontend-v2
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: ../frontend-v2
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e

  database:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://nextess:nextess@localhost:5432/nextess_ci
    defaults:
      run:
        working-directory: database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma validate
      - name: Validate canonical mission package
        run: npm run mission:validate -- 'content/nextess_missions(4).json'
