<!-- Nextess embedded simulation: physics-bike-braking -->
<div id="nextess-bike-braking-sim" class="nextess-sim" aria-label="Bicycle braking simulation">
  <style>
    #nextess-bike-braking-sim{--bg:#12131b;--deep:#07080c;--card:#181926;--line:rgba(167,139,250,.20);--violet:#a78bfa;--violet2:#8b5cf6;--text:#e2e8f0;--muted:#94a3b8;--green:#5af0b4;--red:#f97386;--amber:#ffd666;box-sizing:border-box;width:100%;height:100%;min-height:500px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:17px;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:auto}
    #nextess-bike-braking-sim *{box-sizing:border-box}
    #nextess-bike-braking-sim .sim-head{display:flex;align-items:center;justify-content:space-between;height:24px;margin-bottom:8px}
    #nextess-bike-braking-sim .title{display:flex;align-items:center;gap:8px;color:#fff;font-size:16px;font-weight:700}
    #nextess-bike-braking-sim .title-mark{width:17px;height:14px;border:2px solid var(--violet);border-radius:4px;position:relative}
    #nextess-bike-braking-sim .title-mark:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--violet);right:2px;top:2px}
    #nextess-bike-braking-sim .live{display:flex;align-items:center;gap:6px;padding:3px 11px;border:1px solid rgba(167,139,250,.25);background:#181926;border-radius:999px;color:#cebdff;font:700 11px/16.5px ui-monospace,SFMono-Regular,monospace}
    #nextess-bike-braking-sim .dot{width:8px;height:8px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--violet)}
    #nextess-bike-braking-sim .stage{height:192px;border:1px solid var(--line);border-radius:12px;background:var(--deep);position:relative;overflow:hidden;margin-bottom:8px}
    #nextess-bike-braking-sim canvas{width:100%;height:100%;display:block}
    #nextess-bike-braking-sim .overlay{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none}
    #nextess-bike-braking-sim .pill{padding:3px 9px;border:1px solid rgba(167,139,250,.3);background:rgba(7,8,12,.90);border-radius:4px;color:#cebdff;font:700 11px/16.5px Inter,sans-serif}
    #nextess-bike-braking-sim .pill.status{background:rgba(24,25,38,.94);color:var(--green);border-color:rgba(90,240,180,.25)}
    #nextess-bike-braking-sim .stage-readout{position:absolute;left:9px;bottom:8px;display:flex;align-items:end;justify-content:space-between;right:9px;pointer-events:none}
    #nextess-bike-braking-sim .read-label{font-size:11px;color:var(--muted);line-height:16.5px}
    #nextess-bike-braking-sim .read-value{font:700 16px/24px ui-monospace,SFMono-Regular,monospace;color:#fff}
    #nextess-bike-braking-sim .controls,#nextess-bike-braking-sim .telemetry{background:var(--card);border:1px solid rgba(167,139,250,.15);border-radius:12px;padding:9px;margin-bottom:8px}
    #nextess-bike-braking-sim .section-label{font-size:11px;line-height:16.5px;letter-spacing:.55px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px}
    #nextess-bike-braking-sim .row{margin:7px 0 10px}
    #nextess-bike-braking-sim .row-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;line-height:19.5px}
    #nextess-bike-braking-sim output{font:700 13px/19.5px ui-monospace,SFMono-Regular,monospace;color:var(--violet)}
    #nextess-bike-braking-sim input[type=range]{width:100%;accent-color:var(--violet2);margin:4px 0 0}
    #nextess-bike-braking-sim .telemetry{background:var(--deep)}
    #nextess-bike-braking-sim .telemetry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    #nextess-bike-braking-sim .telemetry-head span:first-child{font-size:11px;letter-spacing:.55px;font-weight:700;color:var(--muted)}
    #nextess-bike-braking-sim .telemetry-head span:last-child{font:11px ui-monospace,SFMono-Regular,monospace;color:var(--muted)}
    #nextess-bike-braking-sim .bar-wrap{height:48px;border:1px solid rgba(167,139,250,.15);background:var(--card);border-radius:8px;padding:5px;display:flex;align-items:end;gap:4px}
    #nextess-bike-braking-sim .bar{flex:1;border-radius:2px 2px 0 0;background:rgba(139,92,246,.42);height:25%;transition:height .18s,background .18s}
    #nextess-bike-braking-sim .metrics{display:flex;justify-content:space-between;gap:10px;padding-top:7px}
    #nextess-bike-braking-sim .metric{min-width:0}
    #nextess-bike-braking-sim .metric span{display:block;color:var(--muted);font-size:11px;line-height:16.5px}
    #nextess-bike-braking-sim .metric strong{display:block;color:#fff;font:700 16px/24px ui-monospace,SFMono-Regular,monospace}
    #nextess-bike-braking-sim .metric.right{text-align:right}
    #nextess-bike-braking-sim .run{width:100%;height:42px;border:0;border-radius:10px;background:var(--violet2);color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 0 14px rgba(139,92,246,.25)}
    #nextess-bike-braking-sim .run:hover{filter:brightness(1.08)}
    #nextess-bike-braking-sim .run:active{transform:translateY(1px)}
    @media (max-width:480px){#nextess-bike-braking-sim{padding:12px}.metrics{flex-wrap:wrap}}
  </style>

  <div class="sim-head">
    <div class="title"><span class="title-mark"></span><span>Simulation Sandbox</span></div>
    <div class="live"><span class="dot"></span>60 FPS Live</div>
  </div>

  <div class="stage">
    <canvas class="scene"></canvas>
    <div class="overlay">
      <div class="pill">Bicycle Braking Test</div>
      <div class="pill status" data-status>WITHIN LIMIT</div>
    </div>
    <div class="stage-readout">
      <div><div class="read-label">Kinetic Energy</div><div class="read-value" data-ke>400 J</div></div>
      <div style="text-align:right"><div class="read-label">Brake Energy Limit</div><div class="read-value" data-limit>1600 J</div></div>
    </div>
  </div>

  <div class="controls">
    <div class="section-label">DYNAMIC PHYSICS INPUTS</div>
    <label class="row">
      <div class="row-top"><span>Total Mass (m)</span><output data-mass>50 kg</output></div>
      <input data-mass-range type="range" min="40" max="100" step="1" value="50" aria-label="Total mass">
    </label>
    <label class="row">
      <div class="row-top"><span>Speed (v)</span><output data-speed>4.0 m/s</output></div>
      <input data-speed-range type="range" min="2" max="10" step="0.1" value="4" aria-label="Speed">
    </label>
    <button class="run" data-run>RUN BRAKING TEST</button>
  </div>

  <div class="telemetry">
    <div class="telemetry-head"><span>TELEMETRY DIAGNOSTICS</span><span>Model: KE = ½mv²</span></div>
    <div class="bar-wrap" data-bars></div>
    <div class="metrics">
      <div class="metric"><span>Relative stopping distance</span><strong data-distance>1.00×</strong></div>
      <div class="metric right"><span>Brake condition</span><strong data-condition>SAFE</strong></div>
    </div>
  </div>

  <script>
  (() => {
    const root=document.getElementById('nextess-bike-braking-sim');
    if(!root || root.dataset.ready) return; root.dataset.ready="1";
    const canvas=root.querySelector('.scene'), ctx=canvas.getContext('2d');
    const massR=root.querySelector('[data-mass-range]'), speedR=root.querySelector('[data-speed-range]');
    const massO=root.querySelector('[data-mass]'), speedO=root.querySelector('[data-speed]');
    const keO=root.querySelector('[data-ke]'), status=root.querySelector('[data-status]');
    const distanceO=root.querySelector('[data-distance]'), conditionO=root.querySelector('[data-condition]');
    const bars=root.querySelector('[data-bars]'), run=root.querySelector('[data-run]');
    const LIMIT=1600, REF_KE=400;
    for(let i=0;i<10;i++){const b=document.createElement('div');b.className='bar';bars.appendChild(b)}
    const barEls=[...bars.children];
    let state={mass:50,speed:4,ke:400,rel:1,safe:true,running:false,t:1};
    function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
    new ResizeObserver(resize).observe(canvas);
    function calc(){state.mass=+massR.value;state.speed=+speedR.value;state.ke=.5*state.mass*state.speed**2;state.rel=state.ke/REF_KE;state.safe=state.ke<=LIMIT;
      massO.textContent=state.mass.toFixed(0)+' kg';speedO.textContent=state.speed.toFixed(1)+' m/s';keO.textContent=Math.round(state.ke)+' J';
      distanceO.textContent=state.rel.toFixed(2)+'×';conditionO.textContent=state.safe?'SAFE':'OVER LIMIT';
      status.textContent=state.safe?'WITHIN LIMIT':'OVER LIMIT';status.style.color=state.safe?'#5af0b4':'#f97386';
      status.style.borderColor=state.safe?'rgba(90,240,180,.25)':'rgba(249,115,134,.35)';
      const intensity=Math.min(state.ke/LIMIT,1.35);
      barEls.forEach((b,i)=>{const wave=.35+.65*Math.max(0,Math.sin((i/9)*Math.PI));b.style.height=(8+Math.min(86,intensity*60*wave))+'%';b.style.background=state.safe?'rgba(139,92,246,'+(0.35+0.55*wave)+')':'rgba(249,115,134,'+(0.45+0.45*wave)+')'});
      draw();
    }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
    function draw(){
      const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
      ctx.strokeStyle='rgba(167,139,250,.08)';ctx.lineWidth=1;
      for(let x=0;x<w;x+=Math.max(40,w/8)){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
      for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
      const roadY=h*.78;ctx.fillStyle='#11131c';ctx.fillRect(0,roadY,w,h-roadY);
      ctx.strokeStyle='rgba(203,213,225,.18)';ctx.setLineDash([10,9]);ctx.beginPath();ctx.moveTo(0,roadY+22);ctx.lineTo(w,roadY+22);ctx.stroke();ctx.setLineDash([]);
      const refX=34, maxTravel=w-100, normalized=Math.min(state.rel/8,1), stopX=refX+maxTravel*normalized;
      const x=state.running ? refX+(stopX-refX)*state.t : stopX;
      const y=roadY-13, wheel=15;
      ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,wheel,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x+47,y,wheel,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#a78bfa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+23,y-24);ctx.lineTo(x+47,y);ctx.lineTo(x+11,y);ctx.lineTo(x+23,y-24);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+23,y-24);ctx.lineTo(x+17,y-42);ctx.lineTo(x+30,y-42);ctx.stroke();
      ctx.fillStyle=state.safe?'#5af0b4':'#f97386';roundRect(x+13,y-56,18,10,3);
      if(state.running){ctx.fillStyle='rgba(167,139,250,.18)';roundRect(x-8,y-4,10,8,4);roundRect(x-24,y-4,7,8,4)}
      ctx.fillStyle=state.safe?'#5af0b4':'#f97386';ctx.font='700 10px ui-monospace,monospace';ctx.fillText('STOP',Math.min(stopX,w-38),roadY+10);
    }
    function runTest(){
      calc();state.running=true;state.t=0;let start=performance.now(),duration=700+Math.min(1800,state.rel*180);
      function frame(now){const p=Math.min(1,(now-start)/duration);state.t=1-(1-p)*(1-p);draw();if(p<1)requestAnimationFrame(frame);else{state.running=false;state.t=1;draw()}}
      requestAnimationFrame(frame);
    }
    massR.addEventListener('input',calc);speedR.addEventListener('input',calc);run.addEventListener('click',runTest);
    calc();
  })();
  </script>
</div>
