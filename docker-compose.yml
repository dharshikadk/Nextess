services:
  postgres:
    image: postgres:17-alpine
    container_name: nextess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextess
      POSTGRES_USER: nextess
      POSTGRES_PASSWORD: nextess_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nextess_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextess -d nextess"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nextess-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://nextess:nextess_dev_password@postgres:5432/nextess?schema=public
      PORT: 4000
      HOST: 0.0.0.0
      FRONTEND_ORIGIN: http://localhost:3000
      SESSION_DAYS: 30
      TRUST_PROXY: "false"
    ports:
      - "4000:4000"
    command: >
      sh -c "npm run prisma:generate &&
             npm run prisma:migrate &&
             npm --prefix ../database run seed &&
             npm run dev"

  frontend:
    build:
      context: .
      dockerfile: frontend-v2/Dockerfile
    container_name: nextess-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  nextess_postgres_data:
