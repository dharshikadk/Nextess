<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Price Index Simulation</title><style>body{font:14px system-ui;margin:0;padding:16px;background:#0f111a;color:#e7e9f2}.g{display:grid;gap:10px}.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:#171a26;border:1px solid #30364d;border-radius:12px;padding:12px}label{font-size:11px;color:#aeb5ca;display:block}input,select{box-sizing:border-box;width:100%;padding:8px;background:#0c0f17;color:white;border:1px solid #39415b;border-radius:8px}output{font-weight:700;color:#a78bfa}.ok{color:#6ee7b7}.w{color:#fbbf24}</style><h2>Price Index Simulation</h2><p>Official weights 30/25/15/10/20; low-income weights 55/20/10/5/10. Current indices 114/103/104/102/101.</p><div class="c r"><div><label>Basket</label><select id="basket"><option value="low">Low-income</option><option value="official">Official</option></select></div><div><label>Food</label><input id="food" value="114" type="number" step=".1"></div><div><label>Housing</label><input id="housing" value="103" type="number" step=".1"></div><div><label>Transport</label><input id="transport" value="104" type="number" step=".1"></div><div><label>Education</label><input id="education" value="102" type="number" step=".1"></div><div><label>Other</label><input id="other" value="101" type="number" step=".1"></div><div><label>Wage index</label><input id="wage" value="106" type="number" step=".1"></div></div><div class="c g">Weighted index: <output id="idx"></output><br>Real wage index: <output id="real"></output><br>Purchasing-power change: <output id="chg"></output>%<br>Status: <output id="st"></output></div><script>const I=["basket","food","housing","transport","education","other","wage"];I.forEach(k=>document.getElementById(k).oninput=calc);function calc(){let w=B.value==="low"?[55,20,10,5,10]:[30,25,15,10,20],v=[+FOOD.value,+H.value,+TR.value,+ED.value,+O.value],z=w.reduce((sum,x,i)=>sum+x*v[i],0)/100,real=+W.value/z*100;idx.textContent=z.toFixed(2);REAL.textContent=real.toFixed(2);chg.textContent=(real-100).toFixed(2);let ok=z<=+W.value;st.textContent=ok?"PURCHASING POWER PROTECTED":"PURCHASING POWER FALLS";st.className=ok?"ok":"w";emit()}const B=document.getElementById("basket"),FOOD=document.getElementById("food"),H=document.getElementById("housing"),TR=document.getElementById("transport"),ED=document.getElementById("education"),O=document.getElementById("other"),W=document.getElementById("wage"),idx=document.getElementById("idx"),REAL=document.getElementById("real"),chg=document.getElementById("chg"),st=document.getElementById("st");function getState(){return Object.fromEntries(I.map(k=>[k,document.getElementById(k).value]))}function setState(v){I.forEach(k=>{if(v[k]!=null)document.getElementById(k).value=v[k]})}function emit(){parent.postMessage({type:"nextess-simulation-state",state:getState()},location.origin)}addEventListener("message",e=>{if(e.origin===location.origin&&e.data?.type==="nextess-simulation-restore"){setState(e.data.state||{});calc()}});calc();</script>
