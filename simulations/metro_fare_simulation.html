<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metro Fare Simulation</title><style>body{font:14px system-ui;margin:0;padding:16px;background:#0f111a;color:#e7e9f2}.g{display:grid;gap:10px}.c{background:#171a26;border:1px solid #30364d;border-radius:12px;padding:12px}input{box-sizing:border-box;width:100%;padding:8px;background:#0c0f17;color:white;border:1px solid #39415b;border-radius:8px}label{font-size:11px;color:#aeb5ca;display:block}output{font-weight:700;color:#a78bfa}.ok{color:#6ee7b7}.w{color:#fbbf24}</style><h2>Metro Fare Simulation</h2><p>Trial demand: ₹10→1200, ₹15→1000, ₹20→800, ₹25→600, ₹30→400.</p><div class="c g"><label>Fare ₹</label><input id="fare" value="20" type="number" min="10" max="30"><label>Cost/passenger ₹</label><input id="cost" value="16" type="number"><label>Subsidy/passenger ₹</label><input id="sub" value="0" type="number"></div><div class="c g">Passengers: <output id="p"></output><br>Revenue: ₹<output id="rev"></output><br>Profit: ₹<output id="pro"></output><br>Subsidy cost: ₹<output id="sc"></output><br>Elasticity: <output id="el"></output><br>Status: <output id="st"></output></div><script>const I=["fare","cost","sub"];I.forEach(k=>document.getElementById(k).oninput=calc);const demand={10:1200,15:1000,20:800,25:600,30:400};function calc(){let f=+F.value,c=+C.value,s=+S.value,q=demand[f]??Math.max(0,1400-30*f),r=f*q,pr=(f+s-c)*q,sc=s*q,fs=[10,15,20,25,30],i=fs.indexOf(f),e="n/a";if(i>0)e=Math.abs(((q-demand[fs[i-1]])/demand[fs[i-1]])/((f-fs[i-1])/fs[i-1])).toFixed(2);p.textContent=q;rev.textContent=r.toLocaleString("en-IN");pro.textContent=pr.toLocaleString("en-IN");document.getElementById("sc").textContent=sc.toLocaleString("en-IN");el.textContent=e;let ok=q>=800&&pr>=4000&&sc<=2000;st.textContent=ok?"ALL CONDITIONS MET":"CONDITION NOT MET";st.className=ok?"ok":"w";emit()}const F=document.getElementById("fare"),C=document.getElementById("cost"),S=document.getElementById("sub"),p=document.getElementById("p"),rev=document.getElementById("rev"),pro=document.getElementById("pro"),el=document.getElementById("el"),st=document.getElementById("st");function getState(){return Object.fromEntries(I.map(k=>[k,document.getElementById(k).value]))}function setState(v){I.forEach(k=>{if(v[k]!=null)document.getElementById(k).value=v[k]})}function emit(){parent.postMessage({type:"nextess-simulation-state",state:getState()},location.origin)}addEventListener("message",e=>{if(e.origin===location.origin&&e.data?.type==="nextess-simulation-restore"){setState(e.data.state||{});calc()}});calc();</script>
