<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crane Cable Simulation</title><style>body{font:14px system-ui;margin:0;padding:16px;background:#0f111a;color:#e7e9f2}.g{display:grid;gap:10px}.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:#171a26;border:1px solid #30364d;border-radius:12px;padding:12px}label{display:block;font-size:11px;color:#aeb5ca}input{box-sizing:border-box;width:100%;padding:8px;background:#0c0f17;color:white;border:1px solid #39415b;border-radius:8px}output{font-weight:700;color:#a78bfa}.ok{color:#6ee7b7}.w{color:#fbbf24}</style><h2>Crane Cable Simulation</h2><p>Elastic limit 250 MPa; maximum extension 6 cm; Young's modulus 2.0×10¹¹ Pa.</p><div class="c r"><div><label>Beam mass kg</label><input id="m" value="2000" type="number"></div><div><label>Upward acceleration m/s²</label><input id="a" value="4" type="number" step=".5"></div><div><label>Cable area cm²</label><input id="A" value="1" type="number" step=".1"></div><div><label>Cable length m</label><input id="L" value="50" type="number"></div></div><div class="c g">Tension: <output id="t"></output> kN<br>Stress: <output id="s"></output> MPa<br>Strain: <output id="e"></output><br>Extension: <output id="x"></output> cm<br>Status: <output id="st"></output></div><script>const I=["m","a","A","L"];I.forEach(x=>document.getElementById(x).oninput=calc);function calc(){let m=+M.value,a=+ACC.value,area=+AR.value*1e-4,len=+LEN.value,T=m*(10+a),S=T/area,E=S/2e11,X=E*len*100;t.textContent=(T/1000).toFixed(2);s.textContent=(S/1e6).toFixed(1);e.textContent=E.toExponential(2);x.textContent=X.toFixed(2);let ok=S<=2.5e8&&X<=6;st.textContent=ok?"ELASTIC / WITHIN LIMIT":"LIMIT EXCEEDED";st.className=ok?"ok":"w";emit()}const M=document.getElementById("m"),ACC=document.getElementById("a"),AR=document.getElementById("A"),LEN=document.getElementById("L"),t=document.getElementById("t"),s=document.getElementById("s"),e=document.getElementById("e"),x=document.getElementById("x"),st=document.getElementById("st");function getState(){return Object.fromEntries(I.map(k=>[k,document.getElementById(k).value]))}function setState(v){I.forEach(k=>{if(v[k]!=null)document.getElementById(k).value=v[k]})}function emit(){parent.postMessage({type:"nextess-simulation-state",state:getState()},location.origin)}addEventListener("message",e=>{if(e.origin===location.origin&&e.data?.type==="nextess-simulation-restore"){setState(e.data.state||{});calc()}});calc();</script>
