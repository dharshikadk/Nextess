<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escape Ramp Simulation</title><style>body{font:14px system-ui;margin:0;padding:16px;background:#0f111a;color:#e7e9f2}.g{display:grid;gap:10px}.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:#171a26;border:1px solid #30364d;border-radius:12px;padding:12px}label{display:block;font-size:11px;color:#aeb5ca}input{box-sizing:border-box;width:100%;padding:8px;background:#0c0f17;color:white;border:1px solid #39415b;border-radius:8px}output{font-weight:700;color:#a78bfa}.ok{color:#6ee7b7}.w{color:#fbbf24}</style><h2>Escape Ramp Simulation</h2><p>g = 10 m/s². Test speed, mass, slope, gravel resistance and ramp length.</p><div class="c r"><div><label>Mass kg</label><input id="m" value="8000" type="number"></div><div><label>Entry speed m/s</label><input id="v" value="20" type="number"></div><div><label>Slope sinθ</label><input id="s" value=".10" type="number" step=".01"></div><div><label>Gravel × weight</label><input id="r" value=".30" type="number" step=".01"></div><div><label>Ramp length m</label><input id="l" value="60" type="number"></div></div><div class="c g">Kinetic energy: <output id="ke"></output> kJ<br>Opposing force: <output id="f"></output> kN<br>Deceleration: <output id="a"></output> m/s²<br>Stopping distance: <output id="d"></output> m<br>Exit speed: <output id="e"></output> m/s<br>Status: <output id="st"></output></div><script>const I=["m","v","s","r","l"];I.forEach(x=>document.getElementById(x).oninput=calc);function calc(){let m=+mEl.value,v=+vEl.value,s=+sEl.value,r=+rEl.value,l=+lEl.value,f=m*10*(s+r),a=f/m,d=f?m*v*v/(2*f):Infinity,rem=Math.max(0,.5*m*v*v-f*l);ke.textContent=(.5*m*v*v/1000).toFixed(1);ff.textContent=(f/1000).toFixed(2);aa.textContent=a.toFixed(2);dd.textContent=d.toFixed(2);ee.textContent=Math.sqrt(2*rem/m).toFixed(2);st.textContent=d<=l?"STOPPED":"OVERSHOOT";st.className=d<=l?"ok":"w";emit()}const mEl=m,vEl=v,sEl=s,rEl=r,lEl=l,ke=document.getElementById("ke"),ff=document.getElementById("f"),aa=document.getElementById("a"),dd=document.getElementById("d"),ee=document.getElementById("e"),st=document.getElementById("st");function getState(){return Object.fromEntries(I.map(x=>[x,document.getElementById(x).value]))}function setState(x){I.forEach(k=>{if(x[k]!=null)document.getElementById(k).value=x[k]})}function emit(){parent.postMessage({type:"nextess-simulation-state",state:getState()},location.origin)}addEventListener("message",e=>{if(e.origin===location.origin&&e.data?.type==="nextess-simulation-restore"){setState(e.data.state||{});calc()}});calc();</script>
